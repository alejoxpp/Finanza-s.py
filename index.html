<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Finanzas Personales</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <h1>Dashboard Finanzas Personales</h1>
        
        <!-- Tarjetas Metricas -->
        <div class="cards-grid">
            <div class="card"><h3>Ingresos</h3><p id="card-ingresos">$0</p></div>
            <div class="card"><h3>Gastos</h3><p id="card-gastos">$0</p></div>
            <div class="card"><h3>Balance</h3><p id="card-balance">$0</p></div>
            <div class="card highlight"><h3>Predicción Próx. Mes</h3><p id="card-prediccion">$0</p></div>
        </div>

        <!-- Seccion Alertas -->
        <div id="alerta-anomalias" class="alert-box" style="display:none;">
            <h3>⚠️ Alerta de Gastos Anómalos Detectados</h3>
            <ul id="lista-anomalias"></ul>
        </div>

        <!-- Graficos -->
        <div class="charts-grid">
            <div class="chart-container">
                <canvas id="chartCategorias"></canvas>
            </div>
            <div class="chart-container">
                <canvas id="chartTendencia"></canvas>
            </div>
        </div>

        <!-- Formulario Registro -->
        <div class="form-section">
            <h2>Registrar Movimiento</h2>
            <form id="form-movimiento">
                <input type="number" id="monto" placeholder="Monto" step="0.01" required>
                <input type="date" id="fecha" required>
                <select id="tipo" required>
                    <option value="gasto">Gasto</option>
                    <option value="ingreso">Ingreso</option>
                </select>
                <select id="categoria" required></select>
                <input type="text" id="descripcion" placeholder="Descripción">
                <button type="submit">Guardar</button>
            </form>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
